name: Backend CI

on:
  pull_request:
    branches: [chore/production-ready]
  push:
    branches: [chore/production-ready]

jobs:
  test:
    name: Maven Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode test
