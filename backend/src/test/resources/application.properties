# ─────────────────────────────────────────────────────────────────────────────
# Configuración EXCLUSIVA para tests.
# OJO: este archivo ECLIPSA por completo a src/main/resources/application.properties
# (el classpath de test tiene prioridad y comparten nombre), así que debe definir
# TODAS las propiedades que leen los beans, con sus claves reales.
# Usa H2 en memoria para no depender de MySQL ni de secretos reales.
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=backend-test

# Base de datos H2 en memoria (modo compatible MySQL), recreada en cada arranque
spring.datasource.url=jdbc:h2:mem:ohmyfreezer;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Europe/Madrid

# Secretos ficticios para que el contexto arranque sin valores reales.
# JWT_SECRET_CODE debe medir >=32 bytes (256 bits) o jjwt rechaza la clave HS256.
JWT_SECRET_CODE=clave-de-test-para-jwt-con-mas-de-treinta-y-dos-bytes-1234567890

# Propiedades con clave "punteada" que leen los beans (EmailService, SecurityConfig)
sendgrid.api-key=SG.test-dummy-key
sendgrid.from-email=test@ohmyfreezer.local
app.cors.allowed-origins=http://localhost:3000

# Este archivo eclipsa por completo application.properties, así que hay que
# repetir aquí el "safe-by-default" de Swagger para que los tests de gating
# sean deterministas (ver SecurityConfigCorsTest / SwaggerGatingEnabledTest).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.flyway.enabled=false
