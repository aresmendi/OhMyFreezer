spring.application.name=backend
spring.datasource.url=${BD_URL}
spring.datasource.username=${BD_USER}
spring.datasource.password=${BD_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Europe/Madrid

sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:arescaballero96@hotmail.com}

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Swagger/OpenAPI deshabilitado por defecto: solo se reactiva explícitamente
# en application-dev.properties. Evita exposición accidental si el perfil
# activo no es el esperado.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Expiración del token JWT en milisegundos (por defecto 24h).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}