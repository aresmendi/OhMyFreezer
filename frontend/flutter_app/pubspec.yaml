name: oh_my_freezer
description: "Aplicación para gestión de stock en cocina"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^21.0.0
  flutter_local_notifications_windows: ^3.0.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/images/logo_1024.png"
  android: true
  ios: true
  windows: 
    generate: true
    image_path: "assets/images/logo_1024.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/images/gorila_chef.png
    - assets/images/skeleton_chef.png
    - assets/images/pinguin_chef.png
    - assets/images/logo_1024.png
    - assets/images/logo_1152.png
